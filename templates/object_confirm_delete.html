{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h1>{{ title }}</h1>

        <p>
            Вы действительно хотите удалить
            <strong>{{ object }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">
                Удалить
            </button>
            <a class="btn btn-secondary"
               href="javascript:history.back()">
                Отмена
            </a>
        </form>
    </div>
</div>
{% endblock %}
