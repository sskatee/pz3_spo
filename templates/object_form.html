{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h1 class="mb-4">{{ title }}</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary" type="submit">
                Сохранить
            </button>
            <a class="btn btn-secondary"
               href="javascript:history.back()">
                Отмена
            </a>
        </form>
    </div>
</div>
{% endblock %}
